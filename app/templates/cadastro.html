<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Delivery10</title>
    <link rel="stylesheet" href="/static/css/cadastro.css">
</head>

<body>

    <div id="cadastro_fundo">

        <h1>Cadastro</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
                <div class="flash-{{ category }}">
            {{ message }}
                </div>
            {% endfor %}
            {% endif %}
            {% endwith %}        

        <div id="cadastro_frente">

            <form action="/cadastro" method="POST">

                <div class="form-group">
                    <label for="nome">Nome completo:</label><br>
                    <input type="text" id="nome" name="nome" style="text-transform: uppercase;" required>
                </div>

                <div class="form-group">
                    <label for="celular">Celular:</label><br>
                    <input type="tel" id="celular" name="celular" style="text-transform: uppercase;" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha:</label><br>
                    <input type="password" id="senha" name="senha" required>
                </div>

                <div class="form-group">
                    <label for="confirmar_senha">Confirmar Senha:</label><br>
                    <input type="password" id="confirmar_senha" name="confirmar_senha"  required>
                </div><br>

                <button type="submit">Cadastrar</button>

                <div class="login-link">
                    Já tem conta? <a href="/login"><br>Entrar

                </div>

            </form>

        </div>

    </div>

</body>
</html>
