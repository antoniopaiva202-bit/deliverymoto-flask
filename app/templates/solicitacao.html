<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitação | Delivery10</title>
  <link rel="stylesheet" href="/static/css/login.css">
</head>

<body>

  <div class="login-container">
    <h1>Solicitação</h1>

    <div class="login-card">

      <form action="/solicitacao" method="POST">

        <h3>Dados para retirada</h3>

        <div class="form-group">
          <label>Solicitante</label>
          <input type="text" name="solicitante" required>
        </div>

        <div class="form-group">
          <label>Endereço</label>
          <input type="text" name="endereco_retirada" required>
        </div>

        <div class="form-group">
          <label>Número</label>
          <input type="text" name="numero_retirada" required>
        </div>

        <div class="form-group">
          <label>Bairro</label>
          <input type="text" name="bairro_retirada" required>
        </div>

        <h3>Dados para entrega</h3>

        <div class="form-group">
          <label>Cliente</label>
          <input type="text" name="cliente" required>
        </div>

        <div class="form-group">
          <label>Endereço</label>
          <input type="text" name="endereco_entrega" required>
        </div>

        <div class="form-group">
          <label>Número</label>
          <input type="text" name="numero_entrega" required>
        </div>

        <div class="form-group">
          <label>Bairro</label>
          <input type="text" name="bairro_entrega" required>
        </div>

        <div class="form-group">
          <label>Data / Hora</label>
          <input type="datetime-local" name="data_hora" required>
        </div>

        <button type="submit">Solicitar</button>

      </form>

    </div>
  </div>

</body>
</html>
